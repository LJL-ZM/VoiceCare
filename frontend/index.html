<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 面试准备助手</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>AI 面试准备助手</h1>
            <p>帮你准备面试，提升求职成功率</p>
        </header>
        
        <main>
            <div class="chat-container" id="chatContainer">
                <div class="message bot">
                    <div class="avatar">🤖</div>
                    <div class="text">你好！我是面试准备助手。你可以问我关于面试的问题。</div>
                </div>
            </div>
            
            <div class="input-container">
                <input type="text" id="questionInput" placeholder="输入你的问题..." autofocus>
                <button onclick="ask()">发送</button>
            </div>
            
            <div class="quick-questions">
                <button onclick="quickAsk('自我介绍')">自我介绍</button>
                <button onclick="quickAsk('你的优点是什么')">你的优点是什么</button>
                <button onclick="quickAsk('你的缺点是什么')">你的缺点是什么</button>
                <button onclick="quickAsk('为什么选择我们公司')">为什么选择我们公司</button>
            </div>
        </main>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
