<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 面试准备助手</title>
    <link rel="stylesheet" href="style.css">
</head>

                <a href="#chat" class="nav-link" data-page="chat">
